<meta name="description" content="Arena Elemental: jogo de luta 3D no navegador com 8 elementos, 33 poderes, rounds infinitos e co-op. Jogue grátis no celular ou no computador.">
<title>Arena Elemental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: slim status strip, a 3D arena window with touch controls over its lower corners, a bar of power buttons below.
   Look: night stone arena with an eight-pointed sigil; every element owns one color. */
:root{
  --void:#0a0912;
  --line:#2a2540;
  --text:#ece8f7;
  --muted:#9a93b5;
  --display:'Cinzel',Georgia,serif;
  --ui:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--text);font-family:var(--ui);
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.app{height:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.hud{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-right:auto;white-space:nowrap}
.stat{font-size:14px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.stat b{color:var(--text);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:4px;letter-spacing:0}
#mute{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer}
#mute:focus-visible,.cta:focus-visible,.die:focus-visible,.pw:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.bars{display:flex;gap:8px;align-items:center;min-width:0}
.bar{position:relative;height:13px;background:#17142a;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar.hp{flex:1;min-width:0}
.bar.gd{width:84px;flex:none}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .12s}
.bar.hp i{background:linear-gradient(90deg,#c2324a,#ff6a5a)}
.bar.gd i{background:linear-gradient(90deg,#2a7fd0,#7fd0ff)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.12em;text-shadow:0 1px 2px #000;text-transform:uppercase}
#chip{flex:none;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--line);border-radius:4px;color:var(--c,var(--muted));white-space:nowrap}
#stage{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0c0a18}
#gl,#hud2{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none}
#hud2{pointer-events:none}
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,54px);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 12px #000;opacity:0}
#banner small{display:block;font-family:var(--ui);font-weight:600;font-size:.4em;letter-spacing:.3em;color:var(--muted)}
#banner.show{animation:bn 1.7s ease-out forwards}
#callout{position:absolute;left:0;right:0;top:11%;text-align:center;pointer-events:none;font-weight:700;font-size:clamp(20px,5.5vw,30px);letter-spacing:.1em;text-transform:uppercase;text-shadow:0 2px 8px #000;opacity:0}
#callout.show{animation:co .95s ease-out forwards}
#combo{position:absolute;right:12px;top:10px;pointer-events:none;text-align:right;font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .2s}
#combo small{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
@keyframes bn{0%{opacity:0;transform:scale(1.25)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
@keyframes co{0%{opacity:0;transform:translateY(8px) scale(1.2)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

#ctl{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;left:12px;bottom:14px;width:128px;height:128px;border-radius:50%;border:2px solid rgba(236,232,247,.22);background:rgba(10,9,18,.28);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(236,232,247,.35);border:2px solid rgba(236,232,247,.5)}
.btns{position:absolute;right:10px;bottom:14px;display:grid;grid-template-columns:repeat(3,56px);grid-auto-rows:56px;gap:8px}
.b{position:relative;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid var(--c,rgba(236,232,247,.4));background:rgba(10,9,18,.5);color:var(--text);font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.b.on{background:var(--c,rgba(236,232,247,.4));color:#0b0a13}
.b:focus-visible{outline:2px solid var(--text)}
.b.punch{--c:#ff7a5a}.b.kick{--c:#ffc15a}.b.block{--c:#7fd0ff}.b.jump{--c:#8ff0cf}.b.dash{--c:#c9a4ff}

.powers{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px}
.powers:empty{display:none}
.pw{position:relative;height:60px;border:1px solid var(--line);background:#120f1e;color:var(--c);border-radius:8px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--ui);cursor:pointer;touch-action:manipulation;overflow:hidden;min-width:0}
.pw.ready{border-color:var(--c);box-shadow:inset 0 0 14px -4px var(--c)}
.pw svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pw .n{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.01em;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw .k{position:absolute;top:3px;left:5px;font-size:10px;color:var(--muted);line-height:1}
.pw .cdm{position:absolute;inset:0;background:rgba(6,5,12,.74);transform-origin:bottom;transform:scaleY(0);pointer-events:none}

#overlay{position:absolute;inset:0;display:flex;overflow-y:auto;padding:18px;background:rgba(8,7,14,.88);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:5}
.panel{margin:auto;width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.center{text-align:center;align-items:center}
.panel h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1.05;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance;
  background:linear-gradient(90deg,#8ab4ff,#a468ff,#ff4a2b,#ffb21a,#2ec8ff,#c29552,#8ff0cf,#7dff2a);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.panel h2{margin:0;font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.panel h3{margin:6px 0 0;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lede{margin:0;font-size:19px;line-height:1.3;max-width:36ch}
.how{margin:0;font-size:16px;line-height:1.35;color:var(--muted);max-width:44ch}
.cta{font-family:var(--ui);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;background:var(--text);color:#0b0a13;border:0;border-radius:6px;padding:13px 26px;cursor:pointer;align-self:flex-start}
.panel.center .cta{align-self:center}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.2}
.list li:first-child{border-top:0}
.list .nm{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.list .ds{color:var(--muted)}
.list .ds b{color:var(--text);font-weight:600}
.big{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.05em;text-transform:uppercase;margin:0}

.dice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;perspective:700px}
.die{position:relative;min-width:0;height:176px;padding:0;border:0;background:none;font-family:var(--ui);color:var(--text);cursor:default}
.face{position:absolute;inset:0;border-radius:10px;border:2px solid var(--c,var(--line));background:#120f1e;box-shadow:inset 0 0 22px -8px var(--c,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 6px;color:var(--c,var(--muted));transform-style:preserve-3d}
.face svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.face .t{font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.face .p{font-size:14px;line-height:1.15;color:var(--text);text-align:center;min-height:16px;font-weight:600}
.face .s{font-size:12px;line-height:1.15;color:var(--muted);text-align:center;min-height:28px}
.die.spin .face{animation:tumble .34s linear infinite}
.die.land .face{animation:pop .38s ease-out}
.die.ready{cursor:pointer}
.die.ready:hover .face,.die.ready:focus-visible .face{transform:translateY(-4px)}
@keyframes tumble{0%{transform:rotateX(0) rotateZ(-5deg)}50%{transform:rotateX(180deg) rotateZ(5deg)}100%{transform:rotateX(360deg) rotateZ(-5deg)}}
@keyframes pop{0%{transform:scale(1.18) rotateZ(-4deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.die.spin .face,.die.land .face,#banner.show,#callout.show{animation:none}#banner.show,#callout.show{opacity:1}.bar i{transition:none}}
#lobby{position:absolute;inset:0;pointer-events:none;z-index:4}
#lobby[hidden]{display:none}
#plusBtn{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;border:2px solid var(--text);background:rgba(10,9,18,.72);color:var(--text);font:700 30px/1 var(--ui);pointer-events:auto;cursor:pointer;display:grid;place-items:center;padding:0}
#plusBtn .dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:#ff4a5a;color:#fff;font:700 12px/19px var(--ui);text-align:center;padding:0 4px;display:none}
#codeTab{position:absolute;right:12px;top:68px;width:min(230px,70vw);pointer-events:auto;background:rgba(10,9,18,.72);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:600 14px var(--ui);letter-spacing:.06em;text-transform:uppercase}
#codeHead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
#codeBody{display:none;margin-top:8px;text-transform:none;letter-spacing:0;font-weight:500}
#codeTab.open #codeBody{display:block}
#codeTab.open #arrow{transform:rotate(180deg)}
#arrow{display:inline-block;transition:transform .15s}
.code{font:700 26px var(--ui);letter-spacing:.22em;color:#ffe27a;text-transform:uppercase}
.mini{font:600 13px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer}
.mem{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:15px}
#playRow{position:absolute;left:0;right:0;bottom:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 14px;pointer-events:none}
#playRow>*{pointer-events:auto}
#playRow .wait{font:600 17px var(--ui);color:var(--muted);letter-spacing:.06em;background:rgba(10,9,18,.7);padding:10px 16px;border-radius:8px}
#toast{position:absolute;left:12px;right:12px;top:12px;max-width:380px;margin:0 auto;background:#171329;border:1px solid var(--text);border-radius:10px;padding:10px 12px;font:600 16px var(--ui);pointer-events:auto;display:none;gap:10px;align-items:center;justify-content:space-between}
#toast.show{display:flex}
#social{position:absolute;inset:0;background:rgba(8,7,14,.95);overflow-y:auto;padding:16px;z-index:6}
#social[hidden]{display:none}
#social .panel{max-width:520px}
.row{display:flex;gap:8px;align-items:center}
.row input,#social input{flex:1;min-width:0;font:600 18px var(--ui);padding:10px;border-radius:6px;border:1px solid var(--line);background:#120f1e;color:var(--text);-webkit-user-select:text;user-select:text}
.fr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:17px}
.fr .on{color:#7dff8a;font-size:13px;margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.fr .off{color:var(--muted);font-size:13px;margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.msg{font-size:15px;color:#ffc15a;min-height:18px;margin:0}
</style>

<div class="app">
  <header class="hud">
    <div class="brand">Arena Elemental</div>
    <div class="stat">Round<b id="rd">1</b></div>
    <div class="stat">Pontos<b id="score">0</b></div>
    <button id="mute" type="button" aria-pressed="false">Som</button>
  </header>
  <div class="bars">
    <div class="bar hp" role="progressbar" aria-label="Vida"><i id="hpf"></i><span id="hpt">100</span></div>
    <div class="bar gd" role="progressbar" aria-label="Guarda"><i id="gdf"></i><span>Guarda</span></div>
    <div id="chip">Sem poder</div>
  </div>
  <main id="stage">
    <canvas id="gl"></canvas>
    <canvas id="hud2"></canvas>
    <div id="banner"></div>
    <div id="callout"></div>
    <div id="combo"></div>
    <div id="ctl">
      <div id="joy" aria-label="Mover"><div id="knob"></div></div>
      <div class="btns">
        <span></span>
        <button class="b jump" data-a="jump" type="button">Pular</button>
        <button class="b dash" data-a="dash" type="button">Dash</button>
        <button class="b block" data-a="block" type="button">Bloq.</button>
        <button class="b kick" data-a="kick" type="button">Chute</button>
        <button class="b punch" data-a="punch" type="button">Soco</button>
      </div>
    </div>
    <div id="lobby" hidden>
      <button id="plusBtn" type="button" aria-label="Amigos e esquadrão">+<i class="dot" id="plusDot"></i></button>
      <div id="codeTab"><div id="codeHead"><span>Esquadrão <b id="sqn">1/5</b></span><b id="arrow">▾</b></div><div id="codeBody"></div></div>
      <div id="playRow"></div>
    </div>
    <div id="toast"></div>
    <div id="overlay"></div>
    <div id="social" hidden></div>
  </main>
  <nav class="powers" id="powers" aria-label="Poderes"></nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ================= núcleo: dados, utilidades, cena, partículas ================= */
const $=s=>document.querySelector(s);
const overlay=$('#overlay');
function fail(m){overlay.hidden=false;overlay.innerHTML='<div class="panel"><h2>Não foi possível iniciar</h2><p class="how">'+m+'</p></div>'}
if(typeof THREE==='undefined'){fail('A biblioteca 3D não carregou. Recarregue a página.');return}
const stage=$('#stage'),glc=$('#gl'),hudc=$('#hud2'),hx=hudc.getContext('2d');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true})}catch(err){fail('Seu navegador não conseguiu iniciar gráficos 3D (WebGL).');return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));

const TAU=Math.PI*2,GRAV=34,ARENA_R=18,sn=Math.sin,cs=Math.cos;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ease=k=>k*k*(3-2*k),easeOut=k=>1-Math.pow(1-k,3);
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const pick=a=>a[(Math.random()*a.length)|0];

/* ---------- elementos e poderes (an = animação do conjurador) ---------- */
const EL={
  raio:{name:'Raio',hex:0x8ab4ff,pass:'Golpes dão choque',pw:[
    {n:'Corrente',s:'Corrente',d:'Raio que salta entre inimigos. Dobro em molhados.',cd:4,an:'cf'},
    {n:'Passo Relâmpago',s:'Passo',d:'Teleporte elétrico que fere tudo no caminho.',cd:6,an:'cf'},
    {n:'Tempestade',s:'Tempestade',d:'Nuvem que derruba raios por 3 segundos.',cd:11,an:'cu'},
    {n:'Aura de Trovão',s:'Trovão',d:'Aura que dispara raios e dá velocidade.',cd:16,an:'cw'},
    {n:'Raio Divino',s:'Divino',d:'Feixe do céu: dano da queda e paraliza todos por 3s.',cd:18,an:'cu'}]},
  escuridao:{name:'Escuridão',hex:0xa468ff,pass:'Golpes roubam vida',pw:[
    {n:'Garras das Sombras',s:'Garras',d:'Três garras de sombra varrem à frente.',cd:5,an:'cf'},
    {n:'Olhos do Vazio',s:'Olhos',d:'Quatro olhos orbitam e disparam feixes.',cd:12,an:'cu'},
    {n:'Buraco Negro',s:'Buraco',d:'Singularidade que suga, fere e implode.',cd:13,an:'cf'},
    {n:'Foice Dimensional',s:'Foice',d:'Corte gigante que lança tudo para o ar.',cd:9,an:'cs'},
    {n:'Asas das Trevas',s:'Asas',d:'Asas: velocidade, roubo de vida e cortes.',cd:18,an:'cw'}]},
  fogo:{name:'Fogo',hex:0xff4a2b,pass:'Golpes queimam',pw:[
    {n:'Bola de Fogo',s:'Bola',d:'Projétil explosivo que queima.',cd:3.5,an:'cf'},
    {n:'Muro de Chamas',s:'Muro',d:'Parede de fogo que queima quem passa.',cd:8,an:'cs'},
    {n:'Dragão de Fogo',s:'Dragão',d:'Serpente flamejante atravessa a arena.',cd:10,an:'cf'},
    {n:'Meteoro',s:'Meteoro',d:'Meteoro devastador cai do céu.',cd:16,an:'cu'}]},
  sol:{name:'Sol',hex:0xffb21a,pass:'Golpes curam você',pw:[
    {n:'Raio Solar',s:'Raio Solar',d:'Feixe gigante de luz que atravessa tudo.',cd:9,an:'cf'},
    {n:'Nova Solar',s:'Nova',d:'Explosão solar que cura e atordoa.',cd:10,an:'cw'},
    {n:'Eclipse',s:'Eclipse',d:'Um sol chove raios sobre os inimigos.',cd:20,an:'cu'}]},
  agua:{name:'Água',hex:0x2ec8ff,pass:'Golpes molham (+25% de dano)',pw:[
    {n:'Onda',s:'Onda',d:'Onda que empurra e molha.',cd:4,an:'cf'},
    {n:'Tridente de Atlântida',s:'Tridente',d:'Tridente dourado que atravessa inimigos.',cd:6,an:'cf'},
    {n:'Dragão d\'Água',s:'Dragão',d:'Dragão de água arremessa quem encontra.',cd:11,an:'cf'},
    {n:'Tsunami',s:'Tsunami',d:'Onda gigante varre a arena.',cd:17,an:'cs'}]},
  terra:{name:'Terra',hex:0xc29552,pass:'Você sofre 20% menos dano',pw:[
    {n:'Pilares de Espinhos',s:'Pilares',d:'Vinhas com espinhos brotam em linha.',cd:6,an:'cs'},
    {n:'Argolas Espinhosas',s:'Argolas',d:'Duas argolas giratórias se chocam.',cd:10,an:'cw'},
    {n:'Chuva de Espinhos',s:'Espinhos',d:'Rajada de espinhos em leque.',cd:5,an:'cf'},
    {n:'Flor Carnívora',s:'Flor',d:'Flor gigante prende e explode em veneno.',cd:14,an:'cu'}]},
  vento:{name:'Vento',hex:0x8ff0cf,pass:'Mais velocidade e alcance',pw:[
    {n:'Lâminas de Vento',s:'Lâminas',d:'Sete lâminas cortantes em leque.',cd:5,an:'cf'},
    {n:'Tornado',s:'Tornado',d:'Tornado que suga e arremessa.',cd:11,an:'cu'},
    {n:'Ciclone',s:'Ciclone',d:'Giro devastador e velocidade extra.',cd:14,an:'cspin'}]},
  nuclear:{name:'Nuclear',hex:0x7dff2a,pass:'Golpes irradiam: dano contínuo e +20% de dano recebido',pw:[
    {n:'Rajada Atômica',s:'Rajada',d:'Cinco feixes radioativos em leque.',cd:6,an:'cf'},
    {n:'Lâmina Radioativa',s:'Lâmina',d:'Corte verde que irradia tudo.',cd:7,an:'cs'},
    {n:'Pilares de Fissão',s:'Fissão',d:'Dois pilares de energia rasgam o chão.',cd:12,an:'cu'},
    {n:'Colosso Radioativo',s:'Colosso',d:'Garras gigantes esmagam o alvo.',cd:16,an:'cu'},
    {n:'Cogumelo Nuclear',s:'Cogumelo',d:'Explosão atômica devastadora.',cd:22,an:'cu'}]}
};
const ORDER=Object.keys(EL);

class Pool{
  constructor(n,add){
    this.n=n;this.i=0;

    this.vel=new Float32Array(n*3);this.life=new Float32Array(n);this.max=new Float32Array(n);this.grav=new Float32Array(n);this.drag=new Float32Array(n);this.s0=new Float32Array(n);this.grow=new Float32Array(n);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    g.setAttribute('aColor',new THREE.BufferAttribute(this.col,3));
    g.setAttribute('aSize',new THREE.BufferAttribute(this.size,1));
    g.setAttribute('aAlpha',new THREE.BufferAttribute(this.alpha,1));
    this.mat=new THREE.ShaderMaterial({uniforms:{uScale:{value:600}},vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,blending:add?AD:THREE.NormalBlending});

  emit(x,y,z,vx,vy,vz,life,size,c,grav,drag,grow){
    const i=this.i;this.i=(i+1)%this.n;const j=i*3;
    this.pos[j]=x;this.pos[j+1]=y;this.pos[j+2]=z;this.vel[j]=vx;this.vel[j+1]=vy;this.vel[j+2]=vz;
    this.col[j]=c.r;this.col[j+1]=c.g;this.col[j+2]=c.b;
    this.life[i]=life;this.max[i]=life;this.s0[i]=size;this.size[i]=size;this.alpha[i]=1;this.grav[i]=grav||0;this.drag[i]=drag||0;this.grow[i]=grow||0;
  }
  update(dt){
    const n=this.n;
    for(let i=0;i<n;i++){
      if(this.life[i]<=0)continue;
      this.life[i]-=dt;
      if(this.life[i]<=0){this.size[i]=0;this.alpha[i]=0;continue}
      const j=i*3,dr=Math.max(0,1-this.drag[i]*dt);
      this.vel[j+1]-=this.grav[i]*dt;
      this.vel[j]*=dr;this.vel[j+1]*=dr;this.vel[j+2]*=dr;
      this.pos[j]+=this.vel[j]*dt;this.pos[j+1]+=this.vel[j+1]*dt;this.pos[j+2]+=this.vel[j+2]*dt;
      const t=this.life[i]/this.max[i];

      this.size[i]=this.s0[i]*(1+this.grow[i]*(1-t));

  }
}

    ptext(e.x+rnd(-.3,.3),e.y+2.2*e.T.scale,e.z,Math.round(dmg),o.col||'#fff',(o.big||dmg>=20)?21:15);
    if(o.label)callout(o.label,o.col2||'#ffe27a');
    puff(e.x,e.y+1.3,e.z,o.pc||(P.el?EL[P.el].hex:0xffffff),7,4.5,.35,.2,0);sfx(170,'square',.09,.05,-60);
    if(o.melee||o.combo){P.combo++;P.comboT=2.6}
    if(o.hs)hitstop(o.hs);
    MP.qHit(e,o,dmg);
    return true;
  }
  
  if(e.rad>0)dmg*=1.2;
  e.hp-=dmg;e.flash=.12;e.hit=.25;
  const L=Math.hypot(o.dirx||0,o.dirz||0)||1,dx=(o.dirx||0)/L,dz=(o.dirz||0)/L;
  if(o.knock){const k=o.knock/(e.T.mass*.8+.2);e.vx+=dx*k;e.vz+=dz*k}
  const armored=e.type==='boss'&&(e.state==='windup'||e.state==='strike'||e.state==='slamwind');
  if(o.stun&&!armored&&!(e.air&&!o.launch)){
    e.stun=Math.max(e.stun,o.stun*(e.type==='boss'?.5:1));

  }

  else if(e.air&&!o.noJuggle&&e.juggle<8){e.vy=Math.max(e.vy,5.5);e.juggle++}
  if(o.burn){e.burn=Math.max(e.burn,o.burn);e.bt=Math.min(e.bt||.3,.3)}
  if(o.wet)e.wet=Math.max(e.wet,o.wet);
  if(o.rad)e.rad=Math.max(e.rad,o.rad);
  if(o.tox)e.tox=Math.max(e.tox,o.tox);
  if(o.slow)e.slow=Math.max(e.slow,o.slow);
  if(o.root)e.root=Math.max(e.root,o.root);
  if(o.para)e.para=Math.max(e.para,o.para);
  const big=o.big||dmg>=20;
  ptext(e.x+rnd(-.3,.3),e.y+2.2*e.T.scale,e.z,Math.round(dmg),o.col||'#fff',big?21:15);
  if(o.label)callout(o.label,o.col2||'#ffe27a');
  const c=P.el?EL[P.el].hex:0xffffff;
  puff(e.x,e.y+1.3,e.z,o.pc||c,big?14:7,big?7:4.5,.35,big?.3:.2,0);
  if(big)ringP(e.x,e.y+1.1,e.z,o.pc||c,1.8,10,.25,.2);
  sfx(big?120:170,'square',.09,.05,-60);
  if(o.melee||o.combo){P.combo++;P.comboT=2.6;passive(e,dmg)}
  if(o.hs)hitstop(o.hs);
  if(e.hp<=0)killEnemy(e);
  return true;
}
function dmgSilent(e,dmg,col){

function hitPlayer(e,dmg,o){

/* ---------- alvos (multijogador) ---------- */
function pickT(e){
  let b=P,bd=P.dead?1e9:Math.hypot(P.x-e.x,P.z-e.z);
  for(const q of MP.players){if(q.dead)continue;const d=Math.hypot(q.x-e.x,q.z-e.z);if(d<bd){bd=d;b=q}}
  return b;
}
function hitT(tg,e,dmg,o){return tg===P?hitPlayer(e,dmg,o):MP.hitRemote(tg,e,dmg,o)}

/* ---------- IA e física ---------- */
function updateEnemies(dt){
  let atk=0;
  for(const e of G.en)if(!e.dead&&(e.state==='windup'||e.state==='strike'||e.state==='slamwind'))atk++;
  G.attackers=atk;
  for(const e of G.en){
    if(e.gone)continue;
    const T=e.T;
    if(e.spawnT>0){e.spawnT-=dt;const k=1-Math.max(0,e.spawnT)/.9;e.g.scale.setScalar(Math.max(.01,easeOut(k)))}
    if(e.dead){
      e.dieT-=dt;const k=Math.max(0,e.dieT/.8);
      e.g.rotation.x=-(1-k)*1.3;e.g.scale.setScalar(Math.max(.01,k));e.g.position.y=e.y;
      e.rg.eyeM.opacity=k;
      if(e.dieT<=0)removeEnemy(e);
      continue;
    }
    if(e.puppet){MP.puppet(e,dt);continue}
    // status
    if(e.burn>0){e.burn-=dt;e.bt-=dt;if(e.bt<=0){e.bt=.5;dmgSilent(e,3.5,'#ff9a3a')}
      if(Math.random()<dt*30)trailP(e.x+rnd(-.3,.3),e.y+rnd(.3,2)*T.scale,e.z+rnd(-.3,.3),0xff7a2b,1,.35,.5,PA,.5)}
    if(e.rad>0){e.rad-=dt;e.rt-=dt;if(e.rt<=0){e.rt=.5;dmgSilent(e,2,'#7dff2a')}
      if(Math.random()<dt*20)trailP(e.x+rnd(-.3,.3),e.y+rnd(.3,2)*T.scale,e.z+rnd(-.3,.3),0x7dff2a,1,.3,.6,PA,.5)}
    if(e.tox>0){e.tox-=dt;e.tt-=dt;if(e.tt<=0){e.tt=.5;dmgSilent(e,3,'#b6ff6a')}
      if(Math.random()<dt*14)trailP(e.x+rnd(-.3,.3),e.y+rnd(.3,2)*T.scale,e.z+rnd(-.3,.3),0xa6ff4a,1,.28,.6,PN,.4)}
    if(e.wet>0){e.wet-=dt;if(Math.random()<dt*10)trailP(e.x+rnd(-.3,.3),e.y+rnd(.5,2)*T.scale,e.z+rnd(-.3,.3),0x2ec8ff,1,.22,.5,PA,.3)}
    if(e.dead)continue;
    e.spCd=Math.max(0,e.spCd-dt);
    if(e.para>0){e.para-=dt;if(e.state!=='air'&&e.state!=='down'){e.state='para'}if(Math.random()<dt*30)trailP(e.x+rnd(-.4,.4),e.y+rnd(.2,2)*T.scale,e.z+rnd(-.4,.4),0x8ab4ff,1,.3,.25,PA,1.2)}
    e.slow=Math.max(0,e.slow-dt);e.root=Math.max(0,e.root-dt);e.flash=Math.max(0,e.flash-dt);e.hit=Math.max(0,e.hit-dt);
    e.atkCd=Math.max(0,e.atkCd-dt);e.slamCd=Math.max(0,e.slamCd-dt);
    const tg=pickT(e);
    const dx=tg.x-e.x,dz=tg.z-e.z,d=Math.hypot(dx,dz)||.01,toP=Math.atan2(dx,dz);
    let mx=0,mz=0;
    const turn=(r)=>{e.face+=angDiff(toP,e.face)*(1-Math.exp(-dt*r))};
    switch(e.state){
      case 'move':{
        turn(9);
        if(e.stun>0){e.state='stagger';break}
        const sp=T.spd*(e.slow>0?.45:1)*(e.root>0?0:1)*(tg.dead?0:1);
        const near=T.reach*.75;
        if(e.type==='mage'){
          if(d<7){mx=-dx/d*sp;mz=-dz/d*sp}else if(d>10){mx=dx/d*sp;mz=dz/d*sp}
          const sd=(e.ph>3?1:-1);mx+=-dz/d*sp*.5*sd;mz+=dx/d*sp*.5*sd;
          if(!tg.dead&&e.atkCd<=0&&d<18&&G.attackers<3&&e.root<=0){e.state='cast';e.st=.9;e.atkCd=rnd(1.8,3);e.castN=3}
          break;
        }
        if(d>near){mx=dx/d*sp;mz=dz/d*sp}
        else if(d<near*.6){mx=-dx/d*sp*.4;mz=-dz/d*sp*.4}
        if(G.attackers>=2&&d<5.5&&d>1){const s2=(e.ph>3?1:-1);mx+=-dz/d*sp*.55*s2;mz+=dx/d*sp*.55*s2;mx-=dx/d*sp*.3;mz-=dz/d*sp*.3}
        if(!tg.dead&&e.atkCd<=0&&G.attackers<2&&e.root<=0){
          if(e.type==='boss'&&e.slamCd<=0&&d<10){startSlam(e,4.6,1)}
          else if(e.type==='boss'&&e.spCd<=0&&d>4){e.state='cast';e.st=1;e.spCd=rnd(5,8);e.castN=7}
          else if(e.type==='brute'&&e.spCd<=0&&d<9&&d>2.5){
            if(Math.random()<.5){startSlam(e,3.6,.9);e.spCd=rnd(5,8)}else{e.state='chargewind';e.st=.7;e.spCd=rnd(6,9);callout('Bruto vai investir!','#ff9a3a')}
          }
          else if(e.type==='grunt'&&e.spCd<=0&&d>3.2&&d<9){e.state='leapwind';e.st=.5;e.spCd=rnd(4,7)}
          else if(d<T.reach+.8){e.state='windup';e.st=T.windup}
        }
        break;}
      case 'cast':
        turn(12);e.st-=dt;if(e.stun>0&&e.type!=='boss'){e.state='stagger';break}
        if(e.st<=0){
          const n=e.castN||1;
          if(e.type==='boss'){for(let i=0;i<n;i++)eshoot(e,e.face+(i-(n-1)/2)*.2,13,T.dmg*.7,0xff4a2a)}
          else{const f=e.face;eshoot(e,f,15,T.dmg,0x4af0ff);later(.16,()=>{if(!e.dead)eshoot(e,e.face,15,T.dmg,0x4af0ff)});later(.32,()=>{if(!e.dead)eshoot(e,e.face,15,T.dmg,0x4af0ff)})}
          e.state='recover';e.st=.6;
        }
        break;
      case 'leapwind':
        turn(14);e.st-=dt;if(e.stun>0){e.state='stagger';break}
        if(e.st<=0){e.state='leap';e.st=.8;e.hitL=false;e.vx=dx/d*17;e.vz=dz/d*17;e.vy=9;e.y=.01;dust(e.x,e.z,6,.6)}
        break;
      case 'leap':
        e.st-=dt;
        if(!e.hitL&&Math.hypot(tg.x-e.x,tg.z-e.z)<T.reach+.35&&Math.abs(tg.y-e.y)<1.8){e.hitL=true;hitT(tg,e,T.dmg*1.5*e.dmgMul,{stun:.4,kb:8})}
        break;
      case 'chargewind':
        turn(14);e.st-=dt;if(e.stun>0){e.state='stagger';break}
        if(Math.random()<dt*30)dust(e.x,e.z,1,.5);
        if(e.st<=0){e.state='charge';e.st=.9;e.cx=dx/d;e.cz=dz/d;e.hitL=false}
        break;
      case 'charge':
        e.face=Math.atan2(e.cx,e.cz);mx=e.cx*13;mz=e.cz*13;e.st-=dt;
        if(Math.random()<dt*40)dust(e.x,e.z,2,.7);
        if(!e.hitL&&Math.hypot(tg.x-e.x,tg.z-e.z)<T.reach+.3&&Math.abs(tg.y-e.y)<1.8){e.hitL=true;hitT(tg,e,T.dmg*1.5*e.dmgMul,{stun:.5,kb:11})}
        if(Math.hypot(e.x,e.z)>ARENA_R-1.3){e.state='stagger';e.stun=1.3;shake(.6);crack(e.x,e.z,2,0xffd9a0,1,.7);debris(e.x,e.z,0x5a4630,6,7);callout('Bruto bateu na parede!','#ffe27a')}
        else if(e.st<=0){e.state='recover';e.st=.8}
        break;
      case 'para':
        if(e.para<=0){e.state='move';e.atkCd=.5}
        break;
      case 'windup':
        if(e.stun>0){e.state='stagger';break}
        if(e.st>.2)turn(12);
        e.st-=dt;if(e.st<=0){e.state='strike';e.st=.2;e.struck=false}
        break;
      case 'strike':{
        if(!e.struck){
          e.struck=true;
          const dd=Math.hypot(tg.x-e.x,tg.z-e.z);
          if(dd<T.reach+.55&&Math.abs(angDiff(Math.atan2(tg.x-e.x,tg.z-e.z),e.face))<1.1&&Math.abs(tg.y-e.y)<1.8)hitT(tg,e,T.dmg*e.dmgMul,{stun:.3});
          puff(e.x+sn(e.face)*T.reach*.6,1.2,e.z+cs(e.face)*T.reach*.6,0xffffff,4,3,.2,.18,0);
          e.vx+=sn(e.face)*3;e.vz+=cs(e.face)*3;
        }
        e.st-=dt;if(e.st<=0){e.state='recover';e.st=.5}
        break;}
      case 'slamwind':
        turn(5);e.st-=dt;
        if(e.stun>0&&e.type!=='boss'){e.state='stagger';break}
        if(e.st<=0){
          const R=e.slamR;e.state='recover';e.st=.7;e.atkCd=1.2;
          flat(e.x,e.z,0xff6a3a,.5,R+.6,.5,.8,false);ringP(e.x,.2,e.z,0xff6a3a,R,22,.5,.4);debris(e.x,e.z,0x5a4630,8,8);crack(e.x,e.z,R-.1,0xff5a3a,1.2,.8);
          shake(.9);boom(.2);
          const dd=Math.hypot(tg.x-e.x,tg.z-e.z);
          if(dd<R+.45&&tg.y<1.3)hitT(tg,e,T.dmg*1.4*e.dmgMul,{stun:.5,kb:9,up:6,ring:true});
        }
        break;
      case 'recover':
        e.st-=dt;if(e.st<=0){e.state='move';e.atkCd=rnd(.7,1.5)}
        break;
      case 'stagger':
        e.stun-=dt;if(e.stun<=0){e.state='move';e.atkCd=Math.max(e.atkCd,.35)}
        break;
      case 'down':
        e.st-=dt;if(e.st<=0){e.state='move';e.atkCd=.5;e.stun=0}
        break;
      case 'air':break;
    }
    // física
    e.x+=(mx+e.vx)*dt;e.z+=(mz+e.vz)*dt;
    const dr=Math.exp(-dt*(e.y>.1?.8:6));e.vx*=dr;e.vz*=dr;
    if(e.air||e.y>0){
      e.vy-=GRAV*.8*dt;e.y+=e.vy*dt;
      if(e.y<=0){
        e.y=0;
        if(e.state==='leap'){e.state='recover';e.st=.6;dust(e.x,e.z,10,.7);e.vy=0}
        else if(e.air){
          e.air=false;
          if(e.slam){e.slam=false;shockwave(e.x,e.z,3.4,14,e,0xffd9a0);shake(.6);dust(e.x,e.z,14,.8);crack(e.x,e.z,2.4,0xffd9a0,.9,.7);callout('Esmagado!','#ffd9a0')}
          else{dust(e.x,e.z,8,.6)}
          e.vy=0;e.state='down';e.st=.7;e.juggle=0;
        }else e.vy=0;
      }
    }
    // arena e separação
    const r=Math.hypot(e.x,e.z);if(r>ARENA_R-.6){e.x*=(ARENA_R-.6)/r;e.z*=(ARENA_R-.6)/r}
    for(const o of G.en){
      if(o===e||o.dead||o.gone||o.y>1.2||e.y>1.2)continue;
      const ox=e.x-o.x,oz=e.z-o.z,od=Math.hypot(ox,oz),min=e.T.r+o.T.r;
      if(od<min&&od>.01){const p=(min-od)*.5;e.x+=ox/od*p;e.z+=oz/od*p}
    }

  }
  for(let i=G.en.length-1;i>=0;i--)if(G.en[i].gone)G.en.splice(i,1);
}
function animateEnemy(e,dt,mx,mz){
  const m=e.rg,T=e.T,sp=Math.hypot(mx,mz);
  e.ph+=dt*(2+sp*2.2);
  m.g.position.set(e.x,e.y,e.z);m.g.rotation.y=e.face;
  const fl=e.flash>0;
  for(const mt of m.mats)mt.emissive.setHex(fl?0xffffff:(e.para>0?(Math.random()<.5?0x335599:0x88aaff):(e.rad>0?0x0f3300:(e.burn>0?0x331000:0))));
  let ls=0,la=0,ra=0,lean=0,crouch=0,tilt=0;
  const st=e.state;
  if(st==='move'){ls=sn(e.ph)*.8*Math.min(1,sp/2);la=-ls*.6;ra=ls*.6;lean=.1}
  else if(st==='windup'){const k=1-Math.max(0,e.st)/T.windup;ra=la=-2.5*ease(Math.min(1,k*1.4));lean=-.25*k;crouch=.12*k}
  else if(st==='strike'){ra=la=-2.5+3*Math.min(1,(.2-e.st)/.08);lean=.5}
  else if(st==='slamwind'){const k=1-Math.max(0,e.st);ra=la=-3.0*ease(Math.min(1,k));lean=-.3*k;crouch=.2*k}
  else if(st==='recover'){ra=la=.5;lean=.2}
  else if(st==='stagger'){ra=la=.5;lean=-.4;tilt=-.2}
  else if(st==='air'){ra=la=-1;lean=-.3;tilt=-.6+e.vy*.02}
  else if(st==='down'){tilt=-1.45;ra=la=.3}
  else if(st==='cast'){ra=la=-2.2+.3*sn(vt*20);lean=-.2}
  else if(st==='leapwind'){crouch=.3;ra=la=.9;lean=.4}
  else if(st==='leap'){tilt=.5;ra=la=-2.4}
  else if(st==='chargewind'){crouch=.2;lean=.5;ra=la=.8}
  else if(st==='charge'){lean=.75;ra=la=.9+sn(vt*30)*.5;ls=sn(e.ph*3)*1.0}
  else if(st==='para'){ra=la=-.8;lean=.1;tilt=.05*sn(vt*60)}
  lean-=e.hit*1.8;
  m.legs[0].rotation.x=ls;m.legs[1].rotation.x=-ls;m.arms[0].rotation.x=la;m.arms[1].rotation.x=ra;
  m.tor.rotation.x=lean;m.hipG.rotation.x=tilt;m.hipG.position.y=.9*T.scale*(1-crouch);

function shoot(o){

  const p=Object.assign({vis:G.vis,vP:P,x:P.x,y:P.y+1.2,z:P.z,vx:sn(yaw)*sp,vy:0,vz:cs(yaw)*sp,r:.6,life:1.2,dmg:10,knock:6,stun:.3,pierce:false,col:0xffffff,size:.4,grav:0,t:0,fl:{}},o);
  p.hit=new Set();if(!p.trailCol)p.trailCol=p.col;
  if(!p.mesh){
    p.mesh=mk(GEO.sph,gmat(p.col,.95),p.x,p.y,p.z,p.size);
    const h=new THREE.Mesh(GEO.sph,gmat(p.col,.28));h.scale.setScalar(1.9);p.mesh.add(h);
  }
  G.proj.push(p);return p;
}
function updateProj(dt){
  const L=G.proj;
  for(let i=L.length-1;i>=0;i--){
    const p=L[i];p.t+=dt;
    const pv0=G.vis,pP0=P;G.vis=!!p.vis;if(p.vis)P=p.vP;
    if(p.upd)p.upd(p,dt);
    p.vy-=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    if(p.mesh&&!p.nomove)p.mesh.position.set(p.x,p.y,p.z);
    if(!p.notrail&&Math.random()<.9)trailP(p.x,p.y,p.z,p.trailCol,1,(p.size||.4)*.9,.3,PA,.5);
    const sl=Math.hypot(p.vx,p.vz)||1;
    for(const e of G.en){
      if(e.dead||p.hit.has(e))continue;
      const dx=e.x-(p.hx!=null?p.hx:p.x),dz=e.z-(p.hz!=null?p.hz:p.z),hh=2.5*e.T.scale;
      if(Math.hypot(dx,dz)<p.r+e.T.r&&p.y>e.y-.6&&p.y<e.y+hh+.4){
        p.hit.add(e);
        hitEnemy(e,Object.assign({dmg:p.dmg*(P.el==='agua'&&e.wet>0?1.25:1),knock:p.knock,stun:p.stun,dirx:p.vx/sl,dirz:p.vz/sl,col:p.dcol||'#fff',big:p.dmg>=20},p.fl));
        if(p.onHit)p.onHit(e,p);
        if(!p.pierce){p.dead=true;break}
      }
    }
    if(p.grav&&p.y<.2&&p.t>.05)p.dead=true;
    if(Math.hypot(p.x,p.z)>ARENA_R+3)p.dead=true;
    if(p.t>=p.life||p.dead){
      if(p.onEnd)p.onEnd(p);
      if(p.mesh)rm(p.mesh);
      L.splice(i,1);
    }
    G.vis=pv0;P=pP0;
  }
}

/* ---------- amigos (db) ---------- */
function frDoc(a,b){return dbc.collection('fr').doc(a+'_'+b)}
function frList(){
  const out=[];
  for(const d of MPS.frs){if(d.st!=='a')continue;const mine=d.from===me.uid;out.push({uid:mine?d.to:d.from,name:mine?d.tn:d.fn})}
  return out;
}
function subFriends(){
  if(!dbc||!me.uid)return;
  let inc=[],out=[];
  const merge=()=>{MPS.frs=inc.concat(out);MPS.reqIn=inc.filter(d=>d.st==='p');MPS.reqOut=out.filter(d=>d.st==='p');
    for(const d of MPS.reqIn)if(!MPS.seenReq.has(d.from)){MPS.seenReq.add(d.from);if(MPS.inited&&G.mode==='menu')toast(d.fn+' quer ser seu amigo','Ver',openSocial)}
    updDot();if(MPS.panel)renderSocial();lobbyRender()};
  try{
    dbc.collection('fr').where('to','==',me.uid).onSnapshot(s=>{inc=s.docs.map(x=>x.data());merge()},()=>{});
    dbc.collection('fr').where('from','==',me.uid).onSnapshot(s=>{out=s.docs.map(x=>x.data());merge()},()=>{});
  }catch(e){}
}
async function addFriend(raw){
  const n=raw.trim();
  if(!/^[A-Za-z0-9_.-]{3,16}$/.test(n))return'Digite o nome exato do seu amigo.';
  if(!dbc||!me.uid)return'Amigos precisam de conexão com o servidor.';
  if(n.toLowerCase()===me.name.toLowerCase())return'Esse é você.';
  try{
    const s=await dbc.doc('names/'+n.toLowerCase()).get();
    if(!s.exists)return'Ninguém usa esse nome.';
    const t=s.data();
    if(frList().some(f=>f.uid===t.uid))return'Vocês já são amigos.';
    if(MPS.reqOut.some(d=>d.to===t.uid))return'Pedido já enviado.';
    const back=MPS.reqIn.find(d=>d.from===t.uid);
    if(back){await frDoc(t.uid,me.uid).update({st:'a'});return'Vocês agora são amigos!'}
    await frDoc(me.uid,t.uid).set({from:me.uid,to:t.uid,fn:me.name,tn:t.name,st:'p'});
    return'Pedido enviado para '+t.name+'.';
  }catch(e){return'Não consegui enviar. Tente de novo.'}
}
async function answerReq(d,ok){
  try{if(ok)await frDoc(d.from,d.to).update({st:'a'});else await frDoc(d.from,d.to).delete()}catch(e){}
}
async function removeFriend(f){
  try{await frDoc(me.uid,f.uid).delete()}catch(e){}
  try{await frDoc(f.uid,me.uid).delete()}catch(e){}
}

  const s=new Set();

  let nr;try{nr=await MPS.RN.join('t-'+code)}catch(e){return'err'}

function rigColor(q){const h=q.el&&EL[q.el]?EL[q.el].hex:0xffffff;if(q.hex!==h){q.hex=h;q.rig.fistM.color.setHex(h);q.rig.aura.material.color.setHex(h);q.rig.aura.material.opacity=q.el?.5:0}}
function remotePose(q,dt){
  const t=Object.assign({},IDLE);t.spin=0;const br=sn(vt*3+q.ph)*.02;t.lean+=br;t.crouch+=br;
  const an=q.an,s=sn(q.runPh);
  if(an===9){t.tilt=-1.45;t.crouch=.9;t.aLz=.9;t.aRz=-.9;t.aLx=-.2;t.aRx=-.2}
  else if(an===8){t.lean=-.3;t.aLx=.5;t.aRx=.5;t.aLb=-.6;t.aRb=-.6;t.crouch=.15}
  else if(an===5){const k=sn(vt*22);if(q.aa==='kick'){t.lRx=-1.6;t.lean=-.2}else{t.aRx=-1.7-.5*k;t.aLx=-1.2+.5*k;t.aRb=-.3;t.aLb=-.3;t.lean=.25}
    if(/^c/.test(q.aa)){t.aLx=-2.6;t.aRx=-2.6;t.aLz=.4;t.aRz=-.4;t.lean=-.1}}
  else if(an===4){t.tilt=.85;t.lean=.2;t.lLx=-1.3;t.lRx=.8;t.aLx=.9;t.aRx=.9}
  else if(an===3){t.aLx=-1.3;t.aLz=-.45;t.aLb=-2.1;t.aRx=-1.3;t.aRz=.45;t.aRb=-2.1;t.crouch=.22}
  else if(an===2){t.aLz=1.1;t.aRz=-1.1;t.aLx=-.3;t.aRx=-.3;t.lLx=-.4;t.lRx=.2}
  else if(an===1){t.lLx=s*.95;t.lRx=-s*.95;t.aLx=-s*.9;t.aRx=s*.9;t.aLb=-1.3;t.aRb=-1.3;t.lean=.1+.28*Math.min(1,q.sp/6.5)}
  const k=1-Math.exp(-dt*22);

}
MP.update=dt=>{
  const tr=MPS.tr,n=tr?teamN():1;

  if(MPS.hq.length&&!MP.host){MPS.hqT+=dt;if(MPS.hqT>.09){MPS.hqT=0;const a=MPS.hq.splice(0,25);tr.emit('dmg',{a}).catch(()=>{})}}
  else if(MP.host)MPS.hq.length=0;
  // sincroniza lista de jogadores remotos
  const seen=new Set(),myId=myPeerId();
  for(const p of viewers()){
    if(p.sameTab)continue;seen.add(p.peer);
    let q=MPS.rp.get(p.peer);
    if(!q){q={peer:p.peer,name:'',x:0,y:0,z:0,face:0,tx:0,ty:0,tz:0,tf:0,rig:makeRig(),pose:Object.assign({},IDLE),runPh:0,ph:Math.random()*6,el:'',hp:0,mx:100,dead:false,an:0,aa:'',sp:0,hex:-1,lx:0,lz:0};MPS.rp.set(p.peer,q);MP.players.push(q);placeSquad();lobbyRender()}
    const s=p.presence;
    q.name=String(s.n||'Jogador').slice(0,16);q.el=s.el&&EL[s.el]?s.el:'';q.hp=+s.hp||0;q.mx=+s.mx||100;q.dead=!!s.d;q.an=+s.an||0;q.aa=String(s.aa||'');q.sp=+s.sp||0;
    if(G.mode==='menu'){q.tx=q.lx;q.tz=q.lz;q.ty=0;q.tf=Math.atan2(P.x-q.lx,P.z-q.lz);q.an=0;q.dead=false}
    else{q.tx=+s.x||0;q.ty=+s.y||0;q.tz=+s.z||0;q.tf=+s.f||0}
  }
  for(const [id,q] of MPS.rp)if(!seen.has(id)){killRemote(q);MPS.rp.delete(id);const i=MP.players.indexOf(q);if(i>=0)MP.players.splice(i,1);placeSquad();lobbyRender()}
  for(const q of MPS.rp.values()){

    q.x+=(q.tx-q.x)*k;q.y+=(q.ty-q.y)*k;q.z+=(q.tz-q.z)*k;q.face+=angDiff(q.tf,q.face)*k;

    if(G.mode==='wait'&&h.md==='fight'&&h.rd===G.round){G.mode='fight';hideOverlay();banner('Round '+G.round,P.el?EL[P.el].name:'',P.el?EL[P.el].color:'#fff')}
  }else{
    if(G.mode==='wait'){
      MPS.waitT+=dt;
      const all=viewers().every(p=>p.sameTab||(+p.presence.pk||0)>=G.round);
      if(all||MPS.waitT>25)MP.beginFight();
    }
    if(G.mode==='fight'&&n>1&&P.dead&&[...MPS.rp.values()].every(q=>q.dead)){MPS.tr.emit('ev',{t:'over'}).catch(()=>{});G.mode='over';later(1.2,()=>showEnd())}
  }

    const a=P.act,sp=Math.hypot(P.vx,P.vz);
    const o={n:me.name,jt:MPS.jt,md:G.mode,rd:G.round,pk:P.el&&(G.mode==='wait'||G.mode==='fight')?G.round:0};
    if(n>1){
      Object.assign(o,{x:r1(P.x),y:r1(P.y),z:r1(P.z),f:r2(P.face),sp:r1(sp),el:P.el||'',hp:Math.round(P.hp),mx:P.max,d:P.dead?1:0,
        an:P.dead?9:P.stun>0?8:a?5:(P.dive||P.dash)?4:P.blocking?3:!P.onGround?2:sp>.7?1:0,aa:a&&a.anim?String(a.anim).slice(0,8):'',
        en:MP.host&&G.mode==='fight'?snapshotEnemies():null});
    }
    tr.presence(o).catch(()=>{});
  }
};

async function claimName(n){

    await ref.set({uid:me.uid,name:n});

    await dbc.doc('data/users/'+me.uid+'/profile').set({name:n});

{

function drawHud(dt){
  hx.clearRect(0,0,W,H);
  // barras dos inimigos
  for(const e of G.en){
    if(e.dead||e.spawnT>0)continue;
    const p=proj(e.x,e.y+(2.3*e.T.scale)+.5,e.z);if(!p.ok)continue;
    const w=e.type==='boss'?90:50,h=e.type==='boss'?7:5,k=Math.max(0,e.hp/e.max);
    hx.fillStyle='rgba(0,0,0,.65)';hx.fillRect(p.x-w/2-1,p.y-1,w+2,h+2);
    hx.fillStyle=k>.5?'#7ad04a':k>.25?'#ffc15a':'#ff5a4a';hx.fillRect(p.x-w/2,p.y,w*k,h);
    let ic='';if(e.burn>0)ic+='🔥';if(e.wet>0)ic+='💧';if(e.rad>0)ic+='☢';if(e.tox>0)ic+='☠';if(e.root>0)ic+='🌿';
    if(ic){hx.font='12px sans-serif';hx.textAlign='center';hx.fillStyle='#fff';hx.fillText(ic,p.x,p.y-4)}
  }
  // alvo
  if(G.mode==='fight'){
    const t=aimTarget(30);
    if(t){const p=proj(t.x,t.y+(2.9*t.T.scale)+.9,t.z);
      if(p.ok){hx.fillStyle=P.el?EL[P.el].color:'#fff';hx.globalAlpha=.9;hx.beginPath();hx.moveTo(p.x,p.y+9);hx.lineTo(p.x-7,p.y-2);hx.lineTo(p.x+7,p.y-2);hx.closePath();hx.fill();hx.globalAlpha=1}}
  }
  MP.hud(hx);
  // textos flutuantes
  hx.textAlign='center';
  for(let i=G.texts.length-1;i>=0;i--){
    const t=G.texts[i];t.life-=dt;if(t.life<=0){G.texts.splice(i,1);continue}
    const p=proj(t.x,t.y+(.9-t.life)*1.4,t.z);if(!p.ok)continue;
    hx.globalAlpha=Math.min(1,t.life*2.2);hx.font='700 '+t.size+'px "Barlow Condensed",sans-serif';hx.lineWidth=3;hx.strokeStyle='rgba(0,0,0,.8)';
    hx.strokeText(t.txt,p.x,p.y);hx.fillStyle=t.col;hx.fillText(t.txt,p.x,p.y);hx.globalAlpha=1;
  }
  // linhas de velocidade
  const dashing=P.dash||P.dive;
  if(dashing){
    hx.strokeStyle='rgba(255,255,255,.35)';hx.lineWidth=1.5;hx.beginPath();
    for(let i=0;i<22;i++){const a=Math.random()*TAU,r0=Math.min(W,H)*(.28+Math.random()*.1),r1=r0+Math.min(W,H)*(.12+Math.random()*.2);hx.moveTo(W/2+Math.cos(a)*r0*1.3,H/2+Math.sin(a)*r0);hx.lineTo(W/2+Math.cos(a)*r1*1.3,H/2+Math.sin(a)*r1)}
    hx.stroke();
  }
  // vinheta de vida baixa / dano
  const low=P.max?1-P.hp/P.max:0,va=Math.max(P.hurtA*.5,low>.65?(low-.65)*1.2:0);
  if(va>.02){const g=hx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,'rgba(255,30,30,'+Math.min(.7,va)+')');hx.fillStyle=g;hx.fillRect(0,0,W,H)}
  if(G.flashA>.01){hx.fillStyle='rgba('+G.flashCol+','+G.flashA+')';hx.fillRect(0,0,W,H);G.flashA*=Math.exp(-dt*7)}
}

let last=performance.now();
let failed=false;
function frame(now){
  if(failed)return;
  try{frameInner(now)}catch(err){failed=true;fail('Algo deu errado: '+(err&&err.message?err.message:err))}
  if(!failed)requestAnimationFrame(frame);
}
function frameInner(now){
  if(document.hidden){last=now;return}
  let dt=Math.min(.05,(now-last)/1000);last=now;if(!(dt>0))return;
  const real=dt;vt+=real;
  if(G.hitstop>0){G.hitstop-=real;dt*=.06}
  G.t+=dt;
  if(G.mode==='menu'||G.mode==='pick')C.yaw+=real*.25;
  MP.update(real);
  updatePlayer(dt);updateEnemies(dt);updateProj(dt);updateEProj(dt);updateFx(dt);
  if(G.mode==='fight'&&(!MP.on||MP.host)&&G.en.length&&!G.en.some(e=>!e.dead))roundClear();
  PA.update(dt);PN.update(dt);
